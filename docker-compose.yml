version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: ow-tracker-db
    restart: unless-stopped
    ports:
      - "27018:27017"  # Expose MongoDB on port 27018 externally
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: overwatch-tracker
    networks:
      - ow-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ow-tracker-api
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/overwatch-tracker
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ow-network

  # Frontend (nginx + React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /overwatch-tracker/api
    container_name: ow-tracker-web
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-changeme}
    depends_on:
      - backend
    networks:
      - ow-network

volumes:
  mongo_data:
    driver: local

networks:
  ow-network:
    driver: bridge
